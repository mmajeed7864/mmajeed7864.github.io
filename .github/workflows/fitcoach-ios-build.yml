name: FitCoach iOS development build

on:
  pull_request:
    paths:
      - "fitcoach-founder-test/**"
      - ".github/workflows/fitcoach-ios-build.yml"
  push:
    branches: [main]
    paths:
      - "fitcoach-founder-test/**"
      - ".github/workflows/fitcoach-ios-build.yml"

permissions:
  contents: read

jobs:
  ios-simulator-compile:
    # Standard public-repository runner, not a paid/larger runner. No uploads.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the existing Xcode installation without accepting new terms
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Verify source and assemble all local app media
        working-directory: fitcoach-founder-test/native
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 tests/*.test.mjs
          node ../tests/check-bundle.js
          brew install webp ffmpeg
          cwebp -version
          ffmpeg -version
          npm run web:build
          npm run web:verify
      - name: Generate and inspect the actual Xcode project
        working-directory: fitcoach-founder-test/native
        env:
          FITCOACH_TEST_IOS_PROJECT: ${{ runner.temp }}/fitcoach-ios
        run: |
          node scripts/prepare-ios-project.mjs --web-bundle dist --out "$FITCOACH_TEST_IOS_PROJECT"
          node --test tests/integration/ios-project.test.mjs
      - name: Compile the complete app for iOS Simulator without signing
        env:
          FITCOACH_TEST_IOS_PROJECT: ${{ runner.temp }}/fitcoach-ios
          FITCOACH_IOS_DERIVED: ${{ runner.temp }}/fitcoach-ios-derived
        run: |
          xcodebuild -project "$FITCOACH_TEST_IOS_PROJECT/ios/App/App.xcodeproj" -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$FITCOACH_IOS_DERIVED" -jobs 2 CODE_SIGNING_ALLOWED=NO build
      - name: Inspect compiled identity, platform, privacy and every media payload
        working-directory: fitcoach-founder-test/native
        env:
          FITCOACH_TEST_IOS_PROJECT: ${{ runner.temp }}/fitcoach-ios
          FITCOACH_IOS_DERIVED: ${{ runner.temp }}/fitcoach-ios-derived
        run: |
          node scripts/verify-ios-app.mjs --app "$FITCOACH_IOS_DERIVED/Build/Products/Debug-iphonesimulator/App.app" --project "$FITCOACH_TEST_IOS_PROJECT"
          git diff --check
          # No simulator start, developer account, provisioning, archive or upload.
