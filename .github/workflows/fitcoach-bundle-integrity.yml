name: FitCoach bundle integrity

on:
  pull_request:
    paths:
      - "fitcoach-founder-test/**"
      - ".github/workflows/fitcoach-bundle-integrity.yml"
  push:
    branches: [main]
    paths:
      - "fitcoach-founder-test/**"
      - ".github/workflows/fitcoach-bundle-integrity.yml"

permissions:
  contents: read

jobs:
  bundle-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify FitCoach loaded scripts and PWA precache
        run: node fitcoach-founder-test/tests/check-bundle.js
