name: FitCoach bundle integrity

on:
  pull_request:
    paths:
      - "fitcoach-founder-test/**"
      - ".github/workflows/fitcoach-bundle-integrity.yml"
  push:
    branches: [main]
    paths:
      - "fitcoach-founder-test/**"
      - ".github/workflows/fitcoach-bundle-integrity.yml"

permissions:
  contents: read

jobs:
  bundle-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the complete FitCoach test suite
        run: node --test fitcoach-founder-test/tests/*.test.mjs
      - name: Verify FitCoach module graph and PWA precache
        run: node fitcoach-founder-test/tests/check-bundle.js
      - name: Syntax-check v0.4 modules
        run: |
          node --check fitcoach-founder-test/v040/app.js
          node --check fitcoach-founder-test/v040/boot.js
          find fitcoach-founder-test/v040 -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Verify native bridge and store-package code gates
        run: |
          node --test fitcoach-founder-test/native/tests/*.test.mjs
          node fitcoach-founder-test/native/scripts/release-readiness.mjs
      - name: Audit production native dependencies
        working-directory: fitcoach-founder-test/native
        run: npm audit --omit=dev --audit-level=high
      - name: Check diff whitespace
        run: git diff --check
