<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F6F9FB">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitCoach">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Premium training, nutrition, progress, and AI coaching in one focused app">
  <script>
    (() => {
      let preference = "light";
      try {
        const saved = localStorage.getItem("fitcoach-theme");
        if (["light", "dark", "system"].includes(saved)) preference = saved;
      } catch {}
      const resolved = preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : preference === "dark" ? "dark" : "light";
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
      document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#071116" : "#F6F9FB";
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest?v=0500">
  <link rel="apple-touch-icon" href="./assets/icon-symbio.svg?v=0500">
  <link rel="icon" href="./assets/icon-symbio.svg?v=0500" type="image/svg+xml">
  <link rel="stylesheet" href="./v040/styles.css?v=0500">
  <link rel="stylesheet" href="./v040/premium-redesign.css?v=0500">
  <title>FitCoach v0.5.0</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="offline-banner" class="offline-banner" role="status" hidden>Live Coach is offline · workout tools still save on this device</div>
  <div id="app-frame">
    <div id="app-stage"></div>
    <div id="mini-workout" hidden></div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation" hidden>
      <button data-action="route" data-value="today" data-route="today" aria-label="Today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
      <button data-action="route" data-value="train" data-route="train" aria-label="Train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6m3-9v12m10-12v12m3-9v6M7 12h10"/></svg><span>Train</span></button>
      <button class="coach-nav" data-action="route" data-value="coach" data-route="coach" aria-label="Coach"><i><b></b></i><span>Coach</span></button>
      <button data-action="route" data-value="nutrition" data-route="nutrition" aria-label="Food and calories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a7 7 0 0 1 14 0c0 4-3.2 7-7 7s-7-3-7-7z"/><path d="M8 11h8M12 7v8"/></svg><span>Food</span></button>
      <button data-action="route" data-value="progress" data-route="progress" aria-label="Progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7V7"/></svg><span>Progress</span></button>
    </nav>
  </div>
  <div id="modal-root" hidden></div>
  <div id="voice-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=0500", { updateViaCache: "none" })
        .then(registration => registration.update())
        .catch(() => {});
    }
  </script>
  <script type="module" src="./v040/app.js?v=0500"></script>
</body>
</html>
